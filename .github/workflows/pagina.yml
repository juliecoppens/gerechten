name: Bouw en publiceer de pagina

on:
  push:
    branches: [main]
    paths:
      - gerechten.csv
      - maak_pagina.py
      - .github/workflows/pagina.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publiceer:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Maak index.html uit gerechten.csv
        run: |
          python maak_pagina.py
          mkdir -p site
          mv index.html site/

      - name: GitHub Pages configureren
        uses: actions/configure-pages@v5

      - name: GitHub Pages-artifact uploaden
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Publiceren naar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
