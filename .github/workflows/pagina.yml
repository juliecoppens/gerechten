name: Bouw en publiceer de pagina

on:
  push:
    branches: [main]
    paths:
      - gerechten.csv
      - maak_pagina.py
      - .github/workflows/pagina.yml
  workflow_dispatch:   # laat je de bouw ook handmatig starten (tabblad Actions)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publiceer:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Maak index.html uit gerechten.csv
        run: |
          python maak_pagina.py
          mkdir site
          mv index.html site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
